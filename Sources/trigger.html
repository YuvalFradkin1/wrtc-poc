<!DOCTYPE html>
<html><head><title>dfe0d84a7b v3</title></head>
<body>
<script>
function post(msg) {
    console.log('[PoC] '+msg);
    try{window.webkit.messageHandlers.status.postMessage(String(msg));}catch(e){}
}
async function run() {
    post('START');
    if(typeof RTCPeerConnection==='undefined'){post('FAIL:NoWebRTC');post('DONE');return;}
    post('INFO:RTCPeerConnection available');
    try {
        const pc1=new RTCPeerConnection({iceServers:[]});
        const pc2=new RTCPeerConnection({iceServers:[]});
        pc1.onicecandidate=e=>{if(e.candidate)pc2.addIceCandidate(e.candidate);};
        pc2.onicecandidate=e=>{if(e.candidate)pc1.addIceCandidate(e.candidate);};
        pc2.ontrack=e=>{
            post('TRACK:kind='+e.track.kind);
            const v=document.createElement('video');
            v.autoplay=true;v.muted=true;
            v.srcObject=e.streams[0];document.body.appendChild(v);
            v.onloadeddata=()=>post('VIDEO:playing');
        };
        const canvas=document.createElement('canvas');
        canvas.width=319;canvas.height=240;
        const ctx=canvas.getContext('2d');
        let f=0;
        setInterval(()=>{
            ctx.fillStyle='hsl('+(f++*5)+',100%,50%)';
            ctx.fillRect(0,0,319,240);
        },33);
        const stream=canvas.captureStream(30);
        stream.getTracks().forEach(t=>pc1.addTrack(t,stream));
        const offer=await pc1.createOffer();
        await pc1.setLocalDescription(offer);
        await pc2.setRemoteDescription(offer);
        const answer=await pc2.createAnswer();
        await pc2.setLocalDescription(answer);
        await pc1.setRemoteDescription(answer);
        post('CONNECTED');
        setTimeout(()=>{
            post('STATE:pc1='+pc1.connectionState+':pc2='+pc2.connectionState);
            post('DONE');
        },10000);
    } catch(e){post('ERR:'+e.message);post('DONE');}
}
window.addEventListener('load',run);
</script></body></html>
